<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de material scout</title>
</head>

<body>

    <h1>Pedido de material scout</h1>

    <form id="pedidoForm">

        <fieldset>
            <legend>Datos personales</legend>

            <label for="nombre">Nombre:</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                required
            >

            <br><br>

            <label for="email">Correo electrónico:</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <br><br>

            <label for="seccion">Sección:</label>
            <select id="seccion" name="seccion" required>
                <option value="">Selecciona una sección</option>
                <option value="Castores">Castores</option>
                <option value="Manada">Manada</option>
                <option value="Tropa">Tropa</option>
                <option value="Escultas">Escultas</option>
                <option value="Clan">Clan</option>
                <option value="Scouter">Scouter</option>
                <option value="Otro">Otro</option>
            </select>
        </fieldset>

        <br>

        <fieldset>
            <legend>Material</legend>

            <p>¿Qué pides?</p>

            <input
                type="checkbox"
                id="forro"
                name="articulo"
                value="forro"
            >
            <label for="forro">Forro — 20 €</label>

            <br>

            <input
                type="checkbox"
                id="camisa"
                name="articulo"
                value="camisa"
            >
            <label for="camisa">Camisa — 25 €</label>

            <br><br>

            <div id="datosForro" hidden>

                <label for="tallaForro">Talla del forro:</label>
                <select id="tallaForro" name="tallaForro">
                    <option value="">Selecciona una talla</option>
                    <option value="8/10">8/10</option>
                    <option value="10/12">10/12</option>
                    <option value="12/14">12/14</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                </select>

                <br><br>

                <label for="cantidadForro">Cantidad de forros:</label>
                <input
                    type="number"
                    id="cantidadForro"
                    name="cantidadForro"
                    min="1"
                    max="99"
                    value="1"
                >

            </div>

            <br>

            <div id="datosCamisa" hidden>

                <label for="tallaCamisa">Talla de la camisa:</label>
                <select id="tallaCamisa" name="tallaCamisa">
                    <option value="">Selecciona una talla</option>
                    <option value="12-13">12-13</option>
                    <option value="XS">XS</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                    <option value="XXL">XXL</option>
                </select>

                <br><br>

                <label for="cantidadCamisa">Cantidad de camisas:</label>
                <input
                    type="number"
                    id="cantidadCamisa"
                    name="cantidadCamisa"
                    min="1"
                    max="99"
                    value="1"
                >

            </div>

        </fieldset>

        <br>

        <fieldset>
            <legend>Precio</legend>

            <p>
                <strong>Total del pedido: <span id="total">0 €</span></strong>
            </p>

            <p>
                El importe se cobrará junto con la cuota
                cuando se entregue el material.
            </p>

        </fieldset>

        <br>

        <fieldset>
            <legend>Observaciones</legend>

            <label for="observaciones">
                ¿Quieres añadir alguna observación?
            </label>

            <br><br>

            <textarea
                id="observaciones"
                name="observaciones"
                rows="5"
                cols="40"
                placeholder="Escribe aquí cualquier observación..."
            ></textarea>

        </fieldset>

        <br>

        <button type="submit">Enviar pedido</button>

    </form>
    <p id="aviso" hidden></p>

    <script src="formulario.js"></script>

</body>
</html>
